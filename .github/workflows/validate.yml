name: validate

# Pull requests, and main itself. (Branch pushes used to run too, so every PR
# push ran the suite twice under two different concurrency groups.)
on:
  push:
    branches: [main]
  pull_request:
  # Lets the suite be re-run on demand from the Actions tab. Worth having: when
  # a run is lost to a GitHub incident rather than to a real failure, re-running
  # the stale run can wedge, and an empty commit is a poor way to retrigger.
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref instead of queueing
# behind it — which also stops abandoned runs piling up during an outage.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Fails closed: a missing runner is a failure, not a pass.
      - name: Run tests
        run: bash tests/run-tests.sh

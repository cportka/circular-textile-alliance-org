name: pages

# Publishes the site to GitHub Pages via Actions, rather than via the legacy
# "deploy from a branch" path. Two things this buys us:
#
#   1. The test suite gates the deploy — a commit that fails validation never
#      reaches the live site. Branch-based publishing has no such hook.
#   2. It runs on the ordinary Actions runner pool, and can be re-run on demand
#      from the Actions tab. The branch-based `pages build and deployment`
#      workflow could not be retriggered when a run was lost to the incident of
#      2026-08-06 — it simply sat queued until GitHub cancelled it.
#
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs. Only the deploy
# job, which runs no repository code, can publish.
permissions: {}

# Never run two publishes at once. cancel-in-progress stays false so an
# in-flight deploy is allowed to finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # actions/checkout
      pages: read      # actions/configure-pages reads the Pages configuration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The gate: publishing a site that fails its own checks is worse than
      # not publishing. Same suite CI runs on every PR.
      - name: Validate the site
        run: bash tests/run-tests.sh

      - uses: actions/configure-pages@v6

      # Publish an allowlist, not the repo root: README, CHANGELOG, tests/ and
      # the bytecode the suite just wrote stay out of production, and
      # .well-known/ goes in (upload-pages-artifact drops dot-paths unless told
      # otherwise, which is how security.txt went unpublished until 0.15.1).
      - name: Stage the public site
        run: bash scripts/stage-site.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    # A manual run from a feature branch validates and stages, but never
    # publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # create the Pages deployment
      id-token: write   # OIDC proof that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
